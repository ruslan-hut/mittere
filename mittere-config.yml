---

env: ${LOG_ENV}
listen:
  bind_ip: 127.0.0.1
  port: ${LISTEN_PORT}
auth_token: ${AUTH_TOKEN}
mongo:
  enabled: true
  host: ${MONGO_HOST}
  port: ${MONGO_PORT}
  user: ${MONGO_USER}
  password: ${MONGO_PASSWORD}
  database: ${MONGO_DATABASE}
telegram:
  enabled: true
  api_key: ${TELEGRAM_API_KEY}
  rate_limit: 20
  rate_window: 60
events:
  ttl_days: 90
link:
  code_ttl_minutes: 30
